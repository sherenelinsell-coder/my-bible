<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的聖經">
<meta name="theme-color" content="#fbfaf7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>我的聖經</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&family=Noto+Serif+Hebrew:wght@400;600&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --fs:22px; --lh:1.85;
  --bg:#fbfaf7; --fg:#22201c; --muted:#6f6a61; --line:#e7e2d8; --card:#ffffff; --soft:#f3efe7; --side:#f4f1ea;
  --accent:#8a5a2b; --accent-soft:#f3e7d8; --danger:#b23b2e; --ok:#3f7d4e;
  --h-yellow:#fff0a3; --h-green:#d5f0c6; --h-blue:#d2e6ff; --h-pink:#ffd8e6; --h-orange:#ffdfbd;
  --shadow:0 8px 28px rgba(40,30,15,.14);
  --vfont:"Noto Serif TC","Songti TC",serif;
  --ufont:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --gfont:"Noto Serif","Gentium Plus",Georgia,serif;
  --hfont:"Noto Serif Hebrew","SBL Hebrew","Times New Roman",serif;
}
body.sepia{--bg:#f4ecd9;--fg:#3a2e21;--muted:#7a6b57;--line:#e2d6bd;--card:#fbf5e8;--soft:#ece2cb;--side:#efe5cf;--accent:#8a5a2b;--accent-soft:#eadbc0}
body.dark{--bg:#151517;--fg:#e8e4dc;--muted:#9a958c;--line:#2d2d32;--card:#1f1f23;--soft:#26262b;--side:#1b1b1e;--accent:#d9a86c;--accent-soft:#3a2f22;--danger:#ff7b6b;--ok:#7cc48d;
  --h-yellow:rgba(255,220,80,.28);--h-green:rgba(120,210,110,.25);--h-blue:rgba(110,165,255,.28);--h-pink:rgba(255,120,170,.26);--h-orange:rgba(255,160,70,.28);
  --shadow:0 8px 28px rgba(0,0,0,.5)}
body.sans{--vfont:"Noto Sans TC","PingFang TC",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ufont);font-size:17px;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font-family:inherit;font-size:17px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:var(--accent)}

/* ---------- layout ---------- */
#side{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--side);border-right:1px solid var(--line);z-index:35;display:flex;flex-direction:column;transition:transform .22s ease;overflow-y:auto}
#side .brand{padding:22px 20px 16px;display:flex;align-items:center;gap:10px}
#side .brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#a0662f,#d9a86c);display:flex;align-items:center;justify-content:center;color:#fff}
#side .brand b{font-size:19px;font-family:var(--vfont)}
#side nav{display:flex;flex-direction:column;padding:4px 10px}
#side nav button{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:10px;font-size:17px;color:var(--fg);text-align:left}
#side nav button svg{color:var(--muted)}
#side nav button:hover{background:var(--soft)}
#side nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
#side nav button.on svg{color:var(--accent)}
#side nav hr{border:0;border-top:1px solid var(--line);margin:8px 6px}
#side .foot{margin-top:auto;padding:14px 20px;font-size:13px;color:var(--muted);line-height:1.6}
#main{margin-left:248px;min-height:100vh;transition:margin .22s ease}
body.noside #side{transform:translateX(-100%)}
body.noside #main{margin-left:0}
#sidescrim{display:none}
@media (max-width:999px){
  #main{margin-left:0}
  #side{transform:translateX(-100%);box-shadow:var(--shadow)}
  body.sideopen #side{transform:none}
  body.sideopen #sidescrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:34}
}

/* ---------- header ---------- */
#top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:4px;padding:6px 10px;max-width:1300px;margin:0 auto}
.ib{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--fg);flex:none}
.ib:hover{background:var(--soft)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
#where{font-size:20px;font-weight:700;padding:6px 12px;border-radius:10px;display:inline-flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
#where:hover{background:var(--soft)}
#where small{font-weight:400;color:var(--muted);font-size:16px}
#vtitle{font-size:20px;font-weight:700;padding:0 8px}
.grow{flex:1}
.chips{display:flex;gap:6px;align-items:center;padding:0 12px 8px;max-width:1300px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:15px;white-space:nowrap;color:var(--muted);background:var(--card)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:500}
.chips .lbl{font-size:14px;color:var(--muted);white-space:nowrap}
.chips .vsep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
#sync{font-size:13px;color:var(--muted);white-space:nowrap;margin-left:auto;padding-left:8px}

/* ---------- reader ---------- */
#view{max-width:1300px;margin:0 auto;padding:14px 14px 120px}
.chead{display:flex;align-items:baseline;gap:12px;padding:8px 10px 14px;flex-wrap:wrap}
.chead h1{font-family:var(--vfont);font-size:calc(var(--fs) * 1.35);margin:0;font-weight:600}
.chead span{color:var(--muted);font-size:17px;font-family:Georgia,serif}
.colnames{display:grid;gap:28px;padding:0 12px 6px;color:var(--muted);font-size:14px;letter-spacing:.05em}
.v{position:relative;border-radius:10px;padding:6px 12px;margin:1px 0;cursor:pointer;transition:background .15s}
.v .cols{display:grid;gap:28px}
.v .t{font-family:var(--vfont);font-size:var(--fs);line-height:var(--lh)}
.v .t.en{font-family:Georgia,"Times New Roman",serif}
body.sans .v .t.en{font-family:system-ui,-apple-system,sans-serif}
.v .stack .t+.t{margin-top:2px}
.v .stack .t.sub{font-size:calc(var(--fs) * .9);color:color-mix(in srgb,var(--fg) 82%,var(--bg))}
.v sup{font-family:var(--ufont);font-size:.6em;color:var(--accent);font-weight:700;margin-right:5px;vertical-align:.45em}
.drop{float:left;font-family:var(--vfont);font-size:calc(var(--fs) * 3.1);line-height:.9;color:var(--accent);font-weight:700;margin:4px 12px 0 0}
.v.sel{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.v.hl-yellow{background:var(--h-yellow)}.v.hl-green{background:var(--h-green)}.v.hl-blue{background:var(--h-blue)}.v.hl-pink{background:var(--h-pink)}.v.hl-orange{background:var(--h-orange)}
.v.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:inset 0 0 0 3px var(--accent)}100%{box-shadow:none}}
.marks{position:absolute;right:-4px;top:6px;display:flex;flex-direction:column;gap:2px}
.mk{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--accent)}
.mk svg{width:18px;height:18px}
.mk.nm{background:var(--accent-soft)}
.v.hasmk{padding-right:36px}
/* interlinear */
.il{display:flex;flex-wrap:wrap;gap:4px 6px;margin:8px 0 4px;padding:8px 6px 6px;border-top:1px dashed var(--line)}
.il.he{direction:rtl}
.w{display:inline-flex;flex-direction:column;align-items:center;padding:4px 7px;border-radius:8px;cursor:pointer;min-width:34px;text-align:center}
.w:hover,.w.on{background:var(--accent-soft)}
.w b{font-weight:400;font-size:calc(var(--fs) * 1.05);line-height:1.3}
.il.gr .w b{font-family:var(--gfont)}
.il.he .w b{font-family:var(--hfont);font-size:calc(var(--fs) * 1.2)}
.w i{font-style:normal;font-size:13px;color:var(--muted);direction:ltr;font-family:var(--gfont)}
.w small{font-size:13px;color:var(--accent);direction:ltr;max-width:130px;line-height:1.3}
.cnav{display:flex;justify-content:space-between;gap:12px;padding:28px 10px 0}
.cnav button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 18px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.empty{max-width:640px;margin:30px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;line-height:1.75}
@media (max-width:720px){
  .v .cols,.colnames{grid-template-columns:1fr !important;gap:4px}
  .v .cols .t+.t{border-top:1px dashed var(--line);padding-top:4px;margin-top:2px}
  .colnames{display:none}
  #view{padding:10px 6px 120px}
  #where{font-size:18px;padding:6px 8px;max-width:48vw}
  #where small{display:none}
  .ib{width:38px;height:40px}
}

/* ---------- home & pages ---------- */
.page{max-width:1100px;margin:0 auto}
.hello{padding:10px 6px 16px}
.hello h2{margin:0;font-size:28px;font-family:var(--vfont)}
.hello p{margin:4px 0 0;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.card h3{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-size:15px;font-weight:400;color:var(--accent)}
.dv{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:66px 28px 24px;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;
  background:radial-gradient(120% 90% at 85% 10%,rgba(255,214,150,.75),transparent 55%),radial-gradient(90% 80% at 10% 100%,rgba(60,30,80,.85),transparent 60%),linear-gradient(160deg,#c9774a 0%,#8e4b5e 45%,#3b2a4f 100%)}
.dv.v2{background:radial-gradient(100% 80% at 80% 0%,rgba(190,230,255,.6),transparent 55%),linear-gradient(170deg,#4f7fa6 0%,#2f5874 50%,#1f3347 100%)}
.dv.v3{background:radial-gradient(100% 80% at 20% 0%,rgba(255,240,190,.6),transparent 50%),linear-gradient(165deg,#7d9b5c 0%,#4f6d43 50%,#2e3f2a 100%)}
.dv .tagline{position:absolute;top:18px;left:24px;font-size:14px;letter-spacing:.12em;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:999px;backdrop-filter:blur(4px)}
.dv .ref{font-size:15px;letter-spacing:.1em;opacity:.92;margin-bottom:8px}
.dv .txt{font-family:var(--vfont);font-size:clamp(22px,2.6vw,30px);line-height:1.6;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.dv .en{font-family:Georgia,serif;font-size:17px;line-height:1.55;opacity:.9;margin-top:10px}
.dv .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.dv .acts button{background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:7px 14px;font-size:15px;display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
.dv .acts svg{width:18px;height:18px}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topics button{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 16px;font-size:16px}
.topics button.on{background:var(--accent);color:#fff}
body.dark .topics button.on{color:#1a1308}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog>div{height:100%;background:var(--accent);border-radius:99px}
.rd{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.rd button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:16px}
.rd button.done{background:color-mix(in srgb,var(--ok) 15%,var(--card));border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}
.plan{display:flex;gap:14px;align-items:flex-start}
.plan .ico{width:52px;height:52px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--vfont);font-size:20px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.day{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;display:flex;gap:8px;align-items:flex-start;background:var(--card);text-align:left}
.day.done{background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.day.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.day.done .ck svg{width:13px;height:13px;stroke-width:3}

/* ---------- action bar ---------- */
#act{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,140%);z-index:30;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;display:flex;align-items:center;gap:4px;padding:6px 8px;transition:transform .2s;max-width:calc(100vw - 16px);overflow-x:auto}
@media (min-width:1000px){body:not(.noside) #act{left:calc(50% + 124px)}}
#act.show{transform:translate(-50%,0)}
#act .cnt{font-size:15px;color:var(--muted);padding:0 8px;white-space:nowrap}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);margin:0 3px;flex:none}
.dot.none{background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.dot.none svg{width:16px;height:16px}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px;flex:none}
.ab{display:inline-flex;align-items:center;gap:5px;padding:8px 10px;border-radius:10px;white-space:nowrap;font-size:15px}
.ab:hover{background:var(--soft)}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:var(--bg);z-index:41;box-shadow:var(--shadow);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
#drawer.show{transform:none}
.dh{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:19px;flex:1;display:flex;align-items:center;gap:6px}
.db{flex:1;overflow-y:auto;padding:14px 16px 40px;-webkit-overflow-scrolling:touch}
.sec{margin:6px 0 20px}
.sec>h4{font-size:15px;color:var(--muted);margin:0 0 8px;font-weight:500;letter-spacing:.04em}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.bgrid button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 4px;font-size:16px;line-height:1.25}
.bgrid button small{display:block;font-size:12.5px;color:var(--muted);font-family:Georgia,serif}
.bgrid button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.cgrid button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 0;font-size:17px}
.cgrid button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 16px;background:var(--accent);color:#fff;font-weight:500;white-space:nowrap}
body.dark .btn{color:#1a1308}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:400}
.btn.danger{background:none;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.sm{padding:6px 11px;font-size:15px}
.btn svg{width:18px;height:18px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer}
.item .ref{font-weight:700;color:var(--accent);font-size:16px}
.item .tx{font-family:var(--vfont);font-size:17px;line-height:1.7;margin-top:3px}
.item .tx2{font-family:Georgia,serif;font-size:15px;line-height:1.6;color:var(--muted);margin-top:3px}
.item .meta{font-size:14px;color:var(--muted);margin-top:4px}
.item mark{background:var(--h-yellow);color:inherit;border-radius:3px;padding:0 1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{padding:8px 14px;font-size:16px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:15px}
.hint{font-size:15px;color:var(--muted);line-height:1.65}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:14px}
.tag button{display:inline-flex;color:inherit}
.tag svg{width:14px;height:14px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
.bib{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.bib .nm{flex:1;min-width:0}
.bib .nm b{display:block}
.bib .nm span{font-size:14px;color:var(--muted)}
.prev{border-left:3px solid var(--accent);background:var(--card);border-radius:0 10px 10px 0;padding:9px 12px;margin:8px 0;cursor:pointer}
.prev .ref{font-weight:700;color:var(--accent);font-size:15px}
.prev .tx{font-family:var(--vfont);font-size:17px;line-height:1.7}
.prev .tx2{font-family:Georgia,serif;font-size:15px;line-height:1.6;color:var(--muted);margin-top:3px}
.prev sup{font-size:.65em;color:var(--accent);margin-right:3px}
#nbody{min-height:220px;resize:vertical;line-height:1.75;font-size:18px}
#ntitle{font-size:19px;font-weight:700}
.status{font-size:14px;color:var(--muted)}
/* word study */
.lexhead{text-align:center;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.lexhead .lm{font-size:40px;line-height:1.3}
.lexhead .lm.he{font-family:var(--hfont)}
.lexhead .lm.gr{font-family:var(--gfont)}
.lexhead .tr{color:var(--muted);font-size:17px;font-family:var(--gfont)}
.lexhead .gl{font-size:20px;font-weight:700;color:var(--accent);margin-top:6px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:16px;line-height:1.6}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.def{font-family:var(--gfont);font-size:16px;line-height:1.75;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.def b{color:var(--accent)}

/* ---------- modal + toast ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);padding:16px}
#modal.show{display:flex}
.mbox{background:var(--bg);border-radius:16px;box-shadow:var(--shadow);width:min(520px,100%);max-height:86vh;overflow:auto;padding:20px 22px}
.mbox h3{margin:0 0 10px;font-size:20px}
.mbox .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:.94}
#verseBtn{font-size:17px;padding:7px 10px;border-radius:10px;display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);background:var(--card);margin-left:4px;color:var(--fg)}
.xr{font-family:var(--ufont);font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px 1px 6px;margin-left:8px;vertical-align:3px;display:inline-flex;align-items:center;gap:3px;line-height:1.6}
.xr svg{width:13px;height:13px;stroke-width:2.2}
.xr:hover{background:var(--accent);color:#fff}
@media (max-width:600px){#nstatus{display:none}}
.bshort{display:none}
@media (max-width:720px){.bfull{display:none}.bshort{display:inline}}
#verseBtn:hover{background:var(--soft)}
@media (max-width:720px){#bar [data-panel=marks],#bar [data-panel=settings]{display:none}#chapBtn{font-size:18px;padding:5px 8px}#verseBtn{font-size:15px;padding:6px 7px}}
#chapBtn{font-size:20px;font-weight:700;padding:6px 10px;border-radius:10px;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);margin-left:2px}
#chapBtn:hover,#where:hover{background:var(--soft)}
#where .car,#chapBtn .car{font-size:13px;color:var(--muted);font-weight:400}
.nview{font-size:18px;line-height:1.85;white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:120px}
.nview h2{font-size:21px;margin:0 0 8px;white-space:normal}
a.vref{color:var(--accent);font-weight:500;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px;cursor:pointer;border-radius:4px;padding:0 1px}
a.vref:hover,a.vref.on{background:var(--accent-soft);text-decoration-style:solid}
#pop{position:fixed;z-index:80;width:min(440px,92vw);max-height:60vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px 12px;display:none}
#pop.show{display:block}
#pop .pref{font-weight:700;color:var(--accent);font-size:16px}
#pop .pref span{font-weight:400;color:var(--muted);font-family:Georgia,serif;margin-left:6px}
#pop .ptx{font-family:var(--vfont);font-size:19px;line-height:1.75;margin:6px 0 2px}
#pop .ptx2{font-family:Georgia,serif;font-size:16px;line-height:1.6;color:var(--muted);margin-bottom:6px}
#pop sup{font-size:.6em;color:var(--accent);margin-right:3px;font-weight:700}
#pop .pacts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;position:sticky;bottom:-12px;background:var(--bg);padding:8px 0 4px}
@media (max-width:600px){#pop{left:0 !important;right:0;bottom:0;top:auto !important;width:100%;max-height:70vh;border-radius:18px 18px 0 0}}
label.f{display:block;font-size:15px;color:var(--muted);margin:10px 0 4px}

const BOOKS = BOOK_SRC.split("\n").map((l,i)=>{const [osis,zh,za,en,ea,ch]=l.split("|");return {n:i+1,osis,zh,za:za.split(",")[0],zaAll:za.split(","),en,ea:ea?ea.split(","):[],ch:+ch};});
const norm = s => String(s).toLowerCase().replace(/[\s._]/g,"");
const NAME_MAP = new Map();
const rawNames = [];
const ROM={"1":["I","1st","First"],"2":["II","2nd","Second"],"3":["III","3rd","Third"]};
BOOKS.forEach(b=>{const vars=[];[b.en,...b.ea].forEach(nm=>{const m=nm&&nm.match(/^([123]) (.+)$/);if(m)ROM[m[1]].forEach(r=>vars.push(r+" "+m[2]));});[b.osis,b.zh,...b.zaAll,b.en,...b.ea,...vars].forEach(nm=>{if(!nm)return;const k=norm(nm);if(!NAME_MAP.has(k))NAME_MAP.set(k,b.n);rawNames.push(nm);});});
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const ALT = [...new Set(rawNames)].sort((a,b)=>b.length-a.length).map(n=>escRe(n).replace(/ /g,"\\s*")).join("|");
const RANGE_SEP = "[-–—~～至到]";
const REF_RE = new RegExp(`(?<![A-Za-z])(${ALT})\\.?\\s*(\\d{1,3})\\s*(?:(?:[:：]\\s*|章\\s*)(\\d{1,3})(?:\\s*節)?((?:\\s*${RANGE_SEP}\\s*\\d{1,3}(?:\\s*節)?)?)((?:\\s*[,，、]\\s*\\d{1,3}(?:\\s*${RANGE_SEP}\\s*\\d{1,3})?)*)|[章篇](?!\\s*\\d))`,"gi");

function parseRefs(text){
  const out=[]; if(!text) return out;
  REF_RE.lastIndex=0; let m;
  while((m=REF_RE.exec(text))){
    const b=NAME_MAP.get(norm(m[1])); if(!b) continue;
    const c=+m[2]; if(c<1||c>BOOKS[b-1].ch) continue;
    if(m[3]===undefined){ out.push({b,c,v1:1,v2:999,whole:true,raw:m[0]}); continue; }
    const v1=+m[3]; let v2=v1; const r=(m[4]||"").match(/\d+/); if(r) v2=Math.max(v1,+r[0]);
    out.push({b,c,v1,v2,raw:m[0]});
    if(m[5]) for(const p of m[5].matchAll(/(\d{1,3})(?:\s*[-–—~～至到]\s*(\d{1,3}))?/g)){const a=+p[1];out.push({b,c,v1:a,v2:Math.max(a,+(p[2]||a))});}
  }
  return out;
}
const bk = n => BOOKS[n-1];
const vkey = (b,c,v)=>`${b}.${c}.${v}`;
const splitKey = k => k.split(".").map(Number);
function refLabel(r,short){const B=bk(r.b);const nm=short?B.za:B.zh;if(r.whole)return `${nm} ${r.c}章`;return `${nm} ${r.c}:${r.v1}${r.v2>r.v1?"-"+r.v2:""}`;}
function keysLabel(keys,short){ // 連續的節合併
  const arr=[...keys].map(splitKey).sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]);
  const groups=[];
  for(const [b,c,v] of arr){const g=groups[groups.length-1];if(g&&g.b===b&&g.c===c&&g.v2===v-1)g.v2=v;else groups.push({b,c,v1:v,v2:v});}
  return groups;
}

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

};
const COLORS=[["yellow","黃"],["green","綠"],["blue","藍"],["pink","粉紅"],["orange","橘"]];
let toastT; function toast(msg,ms=2200){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),ms);}
function fmtDate(ts){const d=new Date(ts);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;}

/* ================= IndexedDB 快取（經文離線用） ================= */
const IDB={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res)=>{try{const r=indexedDB.open("mybible",1);r.onupgradeneeded=()=>r.result.createObjectStore("bibles");r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>res(null);}catch(e){res(null)}});},
  async get(k){const d=await this.open();if(!d)return null;return new Promise(res=>{try{const q=d.transaction("bibles").objectStore("bibles").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null)}});},
  async put(k,v){const d=await this.open();if(!d)return;return new Promise(res=>{try{const tx=d.transaction("bibles","readwrite");tx.objectStore("bibles").put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}});},
  async del(k){const d=await this.open();if(!d)return;try{d.transaction("bibles","readwrite").objectStore("bibles").delete(k);}catch(e){}}
};
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ================= 資料儲存（雲端 db；沒有就存本機） ================= */
const DEF_SETTINGS={fontSize:22,lineHeight:1.85,theme:"light",font:"serif",bibles:[],shown:["cuv","kjv"],order:[],layout:"cols",orig:false,names:"both"};
const BUILTIN=[{id:"cuv",name:"和合本（神版）",short:"和合本",lang:"zh",count:31021,file:"data/cuv.json",builtin:true,ver:2},{id:"kjv",name:"King James Version",short:"KJV",lang:"en",count:31102,file:"data/kjv.json",builtin:true,ver:1}];
function allBibles(){const list=[...BUILTIN,...(S.settings.bibles||[])];const ord=S.settings.order||[];return list.map((e,i)=>[e,ord.indexOf(e.id)<0?1000+i:ord.indexOf(e.id)]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);}
const S={
  mode:"local", assets:null,
  settings:{...DEF_SETTINGS}, state:{b:43,c:3}, hl:{}, bm:{}, notes:new Map(),
  bibles:{}, sel:new Set(), b:43, c:3, noteIndex:new Map(), view:"home", viewOpts:{}, plans:{}, origData:{}, lex:{}, xref:{}, morph:null, syncText:"",

/* ================= 本機儲存＋GitHub 同步 =================
   每一筆資料（一則筆記、一節螢光筆、一個書籤…）都是一個項目 {v:內容, t:修改時間}。
   同步時一項一項比對，較新的留下；刪除也記錄（v:null）。 */
const SY={items:{},base:{},token:null,gistId:null,busy:false,again:false,last:0,err:""};
const SYNC_FILE="my-bible-sync.json", SYNC_DESC="我的聖經 同步資料（請勿刪除）";
function itemSet(key,v){SY.items[key]={v:v===undefined?null:v,t:Date.now()};}
function itemVal(key){const it=SY.items[key];return it?it.v:null;}
async function persistItems(){await IDB.put("__items",JSON.stringify(SY.items));await IDB.put("__base",JSON.stringify(SY.base));}
const persistSoon=debounce(persistItems,300);
function syncMap(prefix,map){ // 把整個 map 和項目比對，只記下有變的
  const seen=new Set();
  for(const [k,v] of Object.entries(map||{})){const key=prefix+k;seen.add(key);const cur=SY.items[key];if(!cur||JSON.stringify(cur.v)!==JSON.stringify(v))itemSet(key,v);}
  for(const key of Object.keys(SY.items)){if(key.startsWith(prefix)&&!seen.has(key)&&SY.items[key].v!==null)itemSet(key,null);}
}
const Store={
  write(id,data){
    if(id==="settings")itemSet("s",data);
    else if(id==="state")itemSet("st",data);
    else if(id==="highlights")syncMap("h:",data.map);
    else if(id==="bookmarks")syncMap("b:",data.map);
    else if(id==="plans")syncMap("p:",data.map);
    else if(id.startsWith("note-"))itemSet("n:"+id,data);
    persistSoon(); scheduleSync(); updSync();
  }
};
function rebuildFromItems(){
  const I=SY.items; const pick=p=>{const o={};for(const [k,it] of Object.entries(I))if(k.startsWith(p)&&it.v!==null)o[k.slice(p.length)]=it.v;return o;};
  S.settings={...DEF_SETTINGS,...(I.s&&I.s.v||{})};
  S.hl=pick("h:"); S.bm=pick("b:"); S.plans=pick("p:");
  const notes=new Map(Object.entries(pick("n:")));
  if(NoteEd.id&&(NoteEd.dirty||NoteEd.mode==="edit")&&NoteEd.obj)notes.set(NoteEd.id,NoteEd.obj);
  S.notes=notes;
}

const GH="https://api.github.com";
async function gh(path,opt={}){
  const r=await fetch(GH+path,{...opt,cache:"no-store",headers:{Authorization:"token "+SY.token,Accept:"application/vnd.github+json",...(opt.body?{"Content-Type":"application/json"}:{})}});
  if(!r.ok){const e=new Error("github "+r.status);e.status=r.status;throw e;}
  return r.status===204?null:r.json();
}
async function findOrCreateGist(){
  for(let page=1;page<=10;page++){const list=await gh(`/gists?per_page=100&page=${page}`);const g=list.find(x=>x.files&&x.files[SYNC_FILE]);if(g)return g.id;if(list.length<100)break;}
  const g=await gh("/gists",{method:"POST",body:JSON.stringify({description:SYNC_DESC,public:false,files:{[SYNC_FILE]:{content:JSON.stringify({v:1,items:{}})}}})});
  return g.id;
}
async function readGist(){
  const g=await gh("/gists/"+SY.gistId); const f=g.files&&g.files[SYNC_FILE]; if(!f)return {};
  let txt=f.content; if(f.truncated){const r=await fetch(f.raw_url,{cache:"no-store"});txt=await r.text();}
  try{return (JSON.parse(txt)||{}).items||{};}catch(e){return {};}
}
function mergeItems(L,R,B){
  const m={}; let conflicts=0; const now=Date.now();
  for(const k of new Set([...Object.keys(L),...Object.keys(R)])){
    const l=L[k],r=R[k];
    if(!r){m[k]=l;continue;} if(!l){m[k]=r;continue;}
    if(l.t===r.t){m[k]=l;continue;}
    const bt=B[k]||0, win=l.t>r.t?l:r, lose=win===l?r:l; m[k]=win;
    if(k.startsWith("n:")&&l.t>bt&&r.t>bt&&l.v&&r.v&&((l.v.body||"")!==(r.v.body||"")||(l.v.title||"")!==(r.v.title||""))){
      const nid="n:note-"+now.toString(36)+Math.random().toString(36).slice(2,6)+conflicts;
      m[nid]={v:{...lose.v,title:"（衝突副本）"+(lose.v.title||""),updated:now},t:now}; conflicts++;
    }
  }
  const old=now-180*86400000; for(const k of Object.keys(m)){if(m[k].v===null&&m[k].t<old)delete m[k];} // 很久以前的刪除記錄清掉
  return {merged:m,conflicts};
}
async function syncNow(){
  if(!SY.token){updSync();return;}
  if(!navigator.onLine){updSync();return;}
  if(SY.busy){SY.again=true;return;}
  SY.busy=true; setSync("同步中…");
  const hadState=!!SY.items.st;
  try{
    if(!SY.gistId){SY.gistId=await findOrCreateGist();LS.set("mybible.gist",SY.gistId);}
    const snap={...SY.items};
    const remote=await readGist();
    let {merged,conflicts}=mergeItems(snap,remote,SY.base);
    for(const k of Object.keys(SY.items)){if(SY.items[k]!==snap[k]){merged[k]=SY.items[k];SY.again=true;}} // 同步途中又改的
    const remoteChanged=Object.keys(merged).some(k=>!remote[k]||remote[k].t!==merged[k].t)||Object.keys(remote).some(k=>!merged[k]);
    if(remoteChanged) await gh("/gists/"+SY.gistId,{method:"PATCH",body:JSON.stringify({files:{[SYNC_FILE]:{content:JSON.stringify({v:1,items:merged})}}})});
    const localChanged=Object.keys(merged).some(k=>SY.items[k]!==merged[k])||Object.keys(SY.items).some(k=>!merged[k]);
    SY.items=merged; SY.base={}; for(const k of Object.keys(merged))SY.base[k]=merged[k].t;
    await persistItems();
    if(localChanged){
      rebuildFromItems();
      if(!hadState&&SY.items.st&&SY.items.st.v&&SY.items.st.v.b&&S.view!=="read"){S.b=SY.items.st.v.b;S.c=SY.items.st.v.c||1;}
      rebuildNoteIndex(); if(!(document.activeElement&&document.activeElement.matches&&document.activeElement.matches("input,textarea")))renderAll(); loadShownBibles(); Panels.refresh();
    }
    SY.last=Date.now(); LS.set("mybible.lastsync",SY.last); SY.err="";
    if(conflicts) toast(`有 ${conflicts} 則筆記在兩台裝置都改過，舊的那份另存成「衝突副本」`,4000);
  }catch(e){
    if(e.status===401) SY.err="同步密碼無效，請到設定重新貼上";
    else if(e.status===404){SY.err="找不到同步資料，下次會重新建立";SY.gistId=null;LS.set("mybible.gist",null);}
    else if(e.status===403) SY.err="GitHub 暫時不讓同步，稍後再試";
    else SY.err="同步失敗，稍後會自動再試";
  }
  SY.busy=false; updSync();
  if(SY.again){SY.again=false;setTimeout(syncNow,800);}
}
const scheduleSync=debounce(()=>syncNow(),4000);
function hm(t){const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}
function updSync(){
  let t;
  if(!SY.token)t="未設定同步（只存在這台裝置）";
  else if(!navigator.onLine)t="離線中・連上網路會自動同步";
  else if(SY.busy)t="同步中…";
  else if(SY.err)t=SY.err;
  else if(SY.last)t="已同步 "+hm(SY.last);
  else t="等待同步…";
  setSync(t);
}

async function setToken(tok){
  tok=(tok||"").trim(); if(!tok){toast("請先貼上同步密碼");return false;}
  const old=SY.token; SY.token=tok;
  try{await gh("/user");}catch(e){SY.token=old;toast(e.status===401?"這組密碼無效，請確認有完整複製":"現在連不上 GitHub，請確認網路");return false;}
  LS.set("mybible.token",tok); SY.gistId=null; LS.set("mybible.gist",null); SY.base={};
  toast("同步設定好了，正在同步…"); await syncNow(); return true;
}

function importOld(txt){
  let o; try{o=JSON.parse(txt.trim());}catch(e){toast("看不懂這段資料，請確認有完整貼上");return;}
  if(!o||typeof o!=="object"||!("notes" in o||"hl" in o)){toast("這不是舊版匯出的資料");return;}
  if(o.settings)itemSet("s",{...DEF_SETTINGS,...o.settings});
  if(o.state)itemSet("st",o.state);
  const mergeMap=(p,m)=>{for(const [k,v] of Object.entries(m||{}))itemSet(p+k,v);};
  mergeMap("h:",o.hl); mergeMap("b:",o.bm); mergeMap("p:",o.plans);
  let n=0; for(const [id,note] of (o.notes||[])){itemSet("n:"+id,note);n++;}
  persistItems(); rebuildFromItems(); if(o.state&&o.state.b){S.b=o.state.b;S.c=o.state.c||1;}
  rebuildNoteIndex(); renderAll(); syncNow();
  toast(`搬好了：${n} 則筆記、${Object.keys(o.bm||{}).length} 個書籤、${Object.keys(o.hl||{}).length} 個螢光筆`,4000);
}

async function downloadAll(btn,prog){
  const jobs=[["lex-greek","data/lex-greek.json"],["lex-hebrew","data/lex-hebrew.json"],["morph","data/morph.json"]];
  for(let b=1;b<=66;b++){jobs.push([`orig-${b}`,`data/orig/${b}.json`]);jobs.push([`xref-${b}`,`data/xref/${b}.json`]);}
  const key={"lex-greek":"lex-greek@1","lex-hebrew":"lex-hebrew@1","morph":"morph@1"};
  btn.disabled=true; let done=0, fail=0;
  for(const [k,url] of jobs){
    const ck=key[k]||(k+"@1");
    try{if(!(await IDB.get(ck))){const r=await fetch(url);if(!r.ok)throw 0;await IDB.put(ck,await r.text());}}catch(e){fail++;}
    done++; prog.textContent=`下載中… ${Math.round(done/jobs.length*100)}%`;
  }
  for(const e of BUILTIN)await loadBible(e);
  LS.set("mybible.allDownloaded",fail?0:Date.now());
  prog.textContent=fail?`有 ${fail} 個檔案沒下載到，請在網路穩定時再按一次`:"全部下載好了，沒有網路也能看原文、字典和串珠 ✓";
  btn.disabled=false;
}

const loading=new Set();
async function loadBible(entry){
  if(S.bibles[entry.id]||loading.has(entry.id))return; loading.add(entry.id);
  try{
    const ck=entry.builtin?entry.id+"@"+entry.ver:entry.id;
    let txt=await IDB.get(ck);
    if(!txt&&entry.file){const r=await fetch(entry.file);if(r.ok){txt=await r.text();IDB.put(ck,txt);}}
    if(!txt&&entry.assetId){const r=await fetch("/_blob/"+entry.assetId);if(r.ok){txt=await r.text();IDB.put(entry.id,txt);}}
    if(txt){S.bibles[entry.id]=JSON.parse(txt);renderMain();}
  }catch(e){console.warn(e)}
  loading.delete(entry.id);
}
function loadShownBibles(){allBibles().forEach(e=>{if(S.settings.shown.includes(e.id))loadBible(e);});}
function shownEntries(){return allBibles().filter(e=>S.settings.shown.includes(e.id));}
function primaryEntries(){const s=shownEntries();return s.length?s:allBibles().slice(0,2);}
function verseText(id,b,c,v){const B=S.bibles[id];return B&&B.books[b-1]&&B.books[b-1][c-1]?B.books[b-1][c-1][v-1]:undefined;}
function chapterCount(b){let n=0;for(const e of primaryEntries()){const B=S.bibles[e.id];if(B&&B.books[b-1])n=Math.max(n,B.books[b-1].length);}return n||bk(b).ch;}

/* ================= 匯入檔案解析 ================= */
function bookFromName(s){if(s==null)return 0;return NAME_MAP.get(norm(s))||0;}
function normalizeBible(raw){
  const t=raw.replace(/^﻿/,"");
  const books=Array.from({length:66},()=>[]); let count=0;
  const meta={name:"",short:"",lang:""};
  const put=(b,c,v,text)=>{b=+b;c=+c;v=+v;if(!(b>=1&&b<=66&&c>=1&&v>=1))return;text=String(text??"").replace(/\s+/g," ").trim();if(!text)return;const ch=books[b-1][c-1]||(books[b-1][c-1]=[]);if(ch[v-1]===undefined)count++;ch[v-1]=text;};
  let j=null; try{j=JSON.parse(t);}catch(e){}
  if(j){
    const src=j.metadata||j.meta||j;
    meta.name=src.name||src.translation||src.version_name||src.title||"";
    meta.short=src.shortName||src.abbreviation||src.short||(typeof src.version==="string"?src.version:"")||"";
    meta.lang=src.language||src.lang||"";
    const list=Array.isArray(j)?j:(j.books||j.Books||j.verses||j.data||j.bible||null);
    if(Array.isArray(list)&&list.length){
      if(list[0]&&typeof list[0]==="object"&&!Array.isArray(list[0])&&Array.isArray(list[0].chapters)){
        list.forEach((B,idx)=>{
          let b=+(B.bookId??B.book_id??B.id??B.number??0);
          if(!(b>=1&&b<=66)) b = list.length===66?idx+1:(bookFromName(B.book)||bookFromName(B.englishName)||bookFromName(B.name)||bookFromName(B.abbrev)||(list.length===27?idx+40:0));
          if(!b)return;
          B.chapters.forEach((ch,ci)=>{
            if(Array.isArray(ch)) ch.forEach((v,vi)=>put(b,ci+1,vi+1,typeof v==="string"?v:(v&&(v.text??v.t))));
            else if(ch&&typeof ch==="object"){const cn=+(ch.chapter??ch.number??ch.c??(ci+1));(ch.verses||[]).forEach((v,vi)=>{if(typeof v==="string")put(b,cn,vi+1,v);else if(v)put(b,cn,v.number??v.verse??v.v??(vi+1),v.text??v.t);});}
          });
        });
      } else {
        list.forEach(v=>{
          if(Array.isArray(v)){ if(v.length>=5)put(v[1],v[2],v[3],v[4]); else if(v.length===4)put(v[0],v[1],v[2],v[3]); return; }
          if(!v||typeof v!=="object")return;
          let b=+(v.book_id??v.bookId??v.b??0); if(!(b>=1&&b<=66)) b=+(v.book)||bookFromName(v.book)||bookFromName(v.book_name)||bookFromName(v.name);
          put(b,v.chapter??v.c,v.verse??v.v??v.number,v.text??v.t);
        });
      }
    } else if(j.resultset&&Array.isArray(j.resultset.row)){
      j.resultset.row.forEach(r=>{const f=r.field||r;put(f[1],f[2],f[3],f[4]);});
    } else if(typeof j==="object"){
      for(const [k,v] of Object.entries(j)){ if(typeof v!=="string")continue; const r=parseRefs(k)[0]; if(r&&!r.whole)put(r.b,r.c,r.v1,v); }
    }
  } else {
    t.split(/\r?\n/).forEach(line=>{
      line=line.trim(); if(!line)return;
      let m=line.match(/^(\d{1,2})\s*[\t,|]\s*(\d{1,3})\s*[\t,|]\s*(\d{1,3})\s*[\t,|]\s*(.+)$/);
      if(m){put(m[1],m[2],m[3],m[4]);return;}
      REF_RE.lastIndex=0; m=REF_RE.exec(line);
      if(m&&m.index===0&&m[3]!==undefined){const b=NAME_MAP.get(norm(m[1]));put(b,m[2],m[3],line.slice(m[0].length));}
    });
  }
  // 補空洞
  books.forEach(B=>{for(let c=0;c<B.length;c++){if(!B[c])B[c]=[];for(let v=0;v<B[c].length;v++)if(B[c][v]===undefined)B[c][v]="";}});
  const nBooks=books.filter(B=>B.length).length;
  let lang=meta.lang; if(!lang){const s=(books[42][2]||[])[15]||(books[0][0]||[])[0]||"";lang=/[一-鿿]/.test(s)?"zh":"en";}
  return {count,nBooks,meta,data:{v:1,lang,books}};
}

function dailyRef(dateStr){const d=new Date(dateStr+"T00:00:00");const start=new Date(d.getFullYear(),0,1);const n=Math.floor((d-start)/86400000)+d.getFullYear();return parseRefs(DAILY[n%DAILY.length])[0];}

const planCache={};
function planDays(id){if(!planCache[id])planCache[id]=PLANS[id].gen();return planCache[id];}
function groupReading(list){const g=[];for(const [b,c] of list){const l=g[g.length-1];if(l&&l.b===b&&l.c2===c-1)l.c2=c;else g.push({b,c1:c,c2:c});}return g;}

function planToday(p){return Math.min(PLANS[p.id].days,Math.max(1,dayDiff(p.start,todayStr())+1));}

async function cachedJSON(key,url){
  let txt=await IDB.get(key);
  if(!txt){const r=await fetch(url);if(!r.ok)throw new Error("load "+url);txt=await r.text();IDB.put(key,txt);}
  return JSON.parse(txt);
}
const pend={};
function once(key,fn){if(!pend[key])pend[key]=fn().catch(e=>{delete pend[key];throw e;});return pend[key];}
function loadOrig(b){if(S.origData[b])return Promise.resolve(S.origData[b]);return once("o"+b,async()=>{const d=await cachedJSON(`orig-${b}@1`,`data/orig/${b}.json`);S.origData[b]=d;return d;});}
function loadLex(lang){return once("lex"+lang,async()=>{const [L,M]=await Promise.all([cachedJSON(`lex-${lang}@1`,`data/lex-${lang}.json`),S.morph?Promise.resolve(S.morph):cachedJSON("morph@1","data/morph.json")]);S.lex[lang]=L;S.morph=M;return L;});}
function loadXref(b){if(S.xref[b])return Promise.resolve(S.xref[b]);return once("x"+b,async()=>{const d=await cachedJSON(`xref-${b}@1`,`data/xref/${b}.json`);S.xref[b]=d;return d;});}
const decRef=n=>({b:Math.floor(n/1e6),c:Math.floor(n/1e3)%1000,v:n%1000});

function planMini(p){
  const P=PLANS[p.id];const day=planToday(p);const done=new Set(p.done||[]);const pct=Math.round(done.size/P.days*100);
  const today=groupReading(planDays(p.id)[day-1]||[]);
  return `<div style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b>${esc(P.t)}</b><span class="small muted">第 ${day} 天 · ${pct}%</span></div>
   <div class="prog" style="margin:8px 0"><div style="width:${pct}%"></div></div>
   <div class="rd">${today.map(g=>`<button data-pgo="${g.b}.${g.c1}" class="${done.has(day)?"done":""}">${esc(readingLabel(g))}</button>`).join("")}
   <button data-pdone="${p.id}.${day}" class="${done.has(day)?"done":""}">${done.has(day)?"✓ 今天完成了":"標記完成"}</button></div></div>`;
}
function bindPlanMini(root){
  root.querySelectorAll("[data-pgo]").forEach(b=>b.onclick=()=>{const [x,c]=b.dataset.pgo.split(".").map(Number);goTo(x,c);});
  root.querySelectorAll("[data-pdone]").forEach(b=>b.onclick=()=>{const [id,d]=b.dataset.pdone.split(".");togglePlanDay(id,+d);});
}
function togglePlanDay(id,d){const p=S.plans[id];if(!p)return;const s=new Set(p.done||[]);if(s.has(d))s.delete(d);else s.add(d);S.plans[id]={...p,done:[...s].sort((a,b)=>a-b)};savePlans();renderMain();}

      ${open===p.id?`<div class="days">${days.map((list,i)=>`<button class="day ${done.has(i+1)?"done":""} ${i+1===day?"today":""}" data-pday="${p.id}.${i+1}"><span class="ck">${done.has(i+1)?ICON.check:""}</span><span><b>第 ${i+1} 天</b><br>${groupReading(list).map(g=>esc(readingLabel(g))).join("、")}</span></button>`).join("")}</div>`:""}

function prevChap(){if(S.c>1)return [S.b,S.c-1];if(S.b>1)return [S.b-1,chapterCount(S.b-1)];return null;}

/* ================= 原文字典 ================= */
function strongParts(st){ // 回傳 [主字, 前後綴...]
  if(!st)return {main:null,aff:[]};
  const main=(st.match(/\{([GH]\d{4}[A-Za-z]?)\}/)||[])[1]; const all=st.match(/[GH]\d{4}[A-Za-z]?/g)||[];
  return {main:main||all[0]||null,aff:all.filter(x=>x!==(main||all[0]))};
}

const POS={V:"動詞",N:"名詞",A:"形容詞",ADV:"副詞",CONJ:"連接詞",PREP:"介系詞",P:"代名詞",T:"冠詞",PRT:"語助詞",INJ:"感嘆詞",R:"代名詞",D:"指示代名詞",I:"疑問代名詞",X:"語助詞",Adv:"副詞",Conj:"連接詞",Prep:"介系詞",Prt:"語助詞",Pron:"代名詞",Intj:"感嘆詞",Ptcl:"語助詞",Ps1c:"人稱字尾",Art:"冠詞"};
function posZh(code){if(!code)return "";const [lang,rest]=code.split(":");if(!rest)return code;if(lang==="N")return "專有名詞";const base=rest.split("-")[0];let z=POS[base]||POS[rest]||rest;if(base==="N"){if(/-M/.test(rest))z="陽性名詞";else if(/-F/.test(rest))z="陰性名詞";else if(/-N/.test(rest))z="中性名詞";}return z;}
function morphZh(mo,lang){if(!mo||!S.morph)return "";if(lang==="grc")return S.morph[mo]||mo;const parts=mo.split("/");const L=parts[0][0];return parts.map((p,i)=>S.morph[i?L+p:p]||p).filter(Boolean).join("　＋　");}

async function doSearch(q,bibId,scope){
  lastSearch={q,scope,bib:bibId}; const res=$("#sres"); if(!q){res.innerHTML="";return;}

    const re=new RegExp(terms.map(escRe).join("|"),"gi");

  }
  res.innerHTML=h;
}

function linkify(text){

  const line=(e)=>{if(!e||!S.bibles[e.id])return "";const parts=[];for(let v=r.v1;v<=cap;v++){const t=verseText(e.id,r.b,r.c,v);if(t)parts.push(`${cap>r.v1?`<sup>${v}</sup>`:""}${esc(t)}`);}return parts.join(" ");};
  const t1=line(e1),t2=line(e2);
  return `<div class="prev" data-jump="${r.b}.${r.c}.${r.whole?0:r.v1}"><div class="ref">${esc(refLabel(r))}</div>${t1?`<div class="tx">${t1}${cap<v2?" …":""}</div>`:`<div class="tx muted">（經文載入中或此譯本沒有）</div>`}${t2?`<div class="tx2">${t2}${cap<v2?" …":""}</div>`:""}</div>`;
}
function verseCountFor(b,c){return verseCount(b,c);}
function renderNotePreview(n){
  const el=$("#nprev"); if(!el)return;
  const anchorRefs=keysLabel(n.anchors||[]); const textRefs=parseRefs((n.title||"")+"\n"+(n.body||""));
  const seen=new Set(); const all=[...anchorRefs,...textRefs].filter(r=>{const k=`${r.b}.${r.c}.${r.v1}.${r.v2}`;if(seen.has(k))return false;seen.add(k);return true;});
  el.innerHTML=all.length?all.slice(0,40).map(refBlock).join(""):`<p class="hint">還沒有寫到經文。</p>`;
}
function noteAsText(n){
  const refs=[...keysLabel(n.anchors||[]),...parseRefs(n.body)]; const ents=primaryEntries().filter(e=>S.bibles[e.id]);
  let out=(n.title?n.title+"\n\n":"")+(n.body||"");
  if(refs.length&&ents[0]){out+="\n\n— 經文 —";const seen=new Set();refs.forEach(r=>{const lab=refLabel(r);if(seen.has(lab)||r.whole)return;seen.add(lab);const t=[];for(let v=r.v1;v<=Math.min(r.v2,r.v1+29);v++){const x=verseText(ents[0].id,r.b,r.c,v);if(x)t.push(x);}out+=`\n${lab} ${t.join(" ")}`;});}
  return out;
}

/* --- 書籤與螢光筆 --- */
function renderMarks(o){
  const tab=o.tab||"bm"; const e0=primaryEntries().find(e=>S.bibles[e.id]);
  const vt=k=>{const [b,c,v]=splitKey(k);return e0?verseText(e0.id,b,c,v)||"":"";};
  const lab=k=>{const [b,c,v]=splitKey(k);return `${bk(b).zh} ${c}:${v}`;};
  const ord=(a,b)=>{const x=splitKey(a),y=splitKey(b);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2];};
  let body=`<div class="tabs"><div class="seg"><button class="${tab==="bm"?"on":""}" data-tab="bm">書籤 ${Object.keys(S.bm).length}</button><button class="${tab==="hl"?"on":""}" data-tab="hl">螢光筆 ${Object.keys(S.hl).length}</button></div></div>`;
  if(tab==="bm"){
    const tags=[...new Set(Object.values(S.bm).map(x=>x.tag).filter(Boolean))]; const tf=o.tag||"";
    if(tags.length)body+=`<div class="row" style="flex-wrap:wrap;margin-bottom:10px"><button class="chip ${!tf?"on":""}" data-tag="">全部</button>${tags.map(t=>`<button class="chip ${tf===t?"on":""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</div>`;
    let keys=Object.keys(S.bm).filter(k=>!tf||S.bm[k].tag===tf).sort((a,b)=>(S.bm[b].t||0)-(S.bm[a].t||0));
    body+=keys.length?`<div class="list">${keys.map(k=>`<div class="item" data-jump="${k}"><div class="row" style="justify-content:space-between"><span class="ref">${esc(lab(k))}</span><button class="ib" data-unbm="${k}" title="移除書籤" style="width:34px;height:34px">${ICON.trash}</button></div><div class="tx">${esc(vt(k))}</div><input class="small" data-tagfor="${k}" placeholder="加分類標籤，例如：背誦、應許" value="${esc(S.bm[k].tag||"")}" style="margin-top:8px;padding:6px 10px;font-size:15px"></div>`).join("")}</div>`:`<p class="hint">還沒有書籤。點選經文後按「書籤」就會加入。</p>`;
  } else {
    const cf=o.color||"";
    body+=`<div class="row" style="flex-wrap:wrap;margin-bottom:10px"><button class="chip ${!cf?"on":""}" data-color="">全部</button>${COLORS.map(([c,nm])=>`<button class="chip ${cf===c?"on":""}" data-color="${c}"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--h-${c});margin-right:5px;vertical-align:-1px;box-shadow:0 0 0 1px var(--line)"></span>${nm}</button>`).join("")}</div>`;
    const keys=Object.keys(S.hl).filter(k=>!cf||S.hl[k]===cf).sort(ord);
    body+=keys.length?`<div class="list">${keys.map(k=>`<div class="item" data-jump="${k}" style="border-left:6px solid var(--h-${S.hl[k]})"><div class="ref">${esc(lab(k))}</div><div class="tx">${esc(vt(k))}</div></div>`).join("")}</div>`:`<p class="hint">還沒有螢光筆標記。點選經文後選顏色就可以。</p>`;
  }
  setDrawer("書籤與螢光筆",body);
  const D=$("#dbody");
  D.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>Panels.open("marks",{tab:b.dataset.tab}));
  D.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>Panels.open("marks",{tab:"bm",tag:b.dataset.tag}));
  D.querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>Panels.open("marks",{tab:"hl",color:b.dataset.color}));
  D.querySelectorAll("[data-unbm]").forEach(b=>b.onclick=e=>{e.stopPropagation();delete S.bm[b.dataset.unbm];S.bm={...S.bm};saveBM();renderReader();renderMarks(o);});
  D.querySelectorAll("[data-tagfor]").forEach(inp=>{inp.onclick=e=>e.stopPropagation();inp.onchange=()=>{const k=inp.dataset.tagfor;if(S.bm[k]){S.bm[k]={...S.bm[k],tag:inp.value.trim()};S.bm={...S.bm};saveBM();}};});
}

/* --- 設定 --- */
function renderSettings(){
  const s=S.settings;
  setDrawer("設定",`
  <div class="sec"><h4>字體大小 <span id="fsv">${s.fontSize}</span></h4><input type="range" min="16" max="36" step="1" value="${s.fontSize}" id="fs"></div>
  <div class="sec"><h4>行距 <span id="lhv">${s.lineHeight}</span></h4><input type="range" min="1.4" max="2.6" step="0.05" value="${s.lineHeight}" id="lh"></div>
  <div class="sec"><h4>字型</h4><div class="seg"><button data-font="serif" class="${s.font==="serif"?"on":""}" style="font-family:'Noto Serif TC',serif">明體</button><button data-font="sans" class="${s.font==="sans"?"on":""}">黑體</button></div></div>
  <div class="sec"><h4>對照版面</h4><div class="seg"><button data-lay="cols" class="${s.layout!=="inter"?"on":""}">左右並排</button><button data-lay="inter" class="${s.layout==="inter"?"on":""}">上下交錯</button></div></div>
  <div class="sec"><h4>書卷名稱</h4><div class="seg"><button data-nm="both" class="${(s.names||"both")==="both"?"on":""}">中英</button><button data-nm="zh" class="${s.names==="zh"?"on":""}">中文</button><button data-nm="en" class="${s.names==="en"?"on":""}">English</button></div></div>
  <div class="sec"><h4>背景</h4><div class="seg"><button data-theme="light" class="${s.theme==="light"?"on":""}">淺色</button><button data-theme="sepia" class="${s.theme==="sepia"?"on":""}">米色</button><button data-theme="dark" class="${s.theme==="dark"?"on":""}">深色</button></div></div>
  <div class="sec"><h4>譯本</h4><div class="list" id="biblist">${allBibles().map((e,i)=>`<div class="bib"><div class="nm"><b>${esc(e.name)}</b><span>${esc(e.short||"")} · ${e.lang==="en"?"英文":e.lang==="zh"?"中文":esc(e.lang||"")} · ${(e.count||0).toLocaleString()} 節${e.builtin?" · 內建":e.assetId?"":" · 只在匯入的那台裝置"}</span></div>
     ${i>0?`<button class="ib" data-mvup="${e.id}" title="往前移">${ICON.up}</button>`:""}${e.builtin?"":`<button class="ib" data-delbib="${e.id}" title="刪除">${ICON.trash}</button>`}</div>`).join("")||`<p class="hint">還沒有譯本。</p>`}</div>
     <p style="margin-top:10px"><button class="btn" data-import="1">${ICON.plus}匯入譯本檔案</button></p>
     <p class="hint">和合本、KJV 已內建。想加別的譯本，可以匯入常見的聖經 JSON 檔，或每行「書卷 章:節 經文」的文字檔（只能用公版或你有權使用的譯本）。排在前面的譯本，對照時在左邊。</p></div>
  <div class="sec"><h4>同步（iPad、iPhone、電腦共用筆記）</h4>
    <div class="card" style="padding:14px 16px"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><b id="syState">${esc(S.syncText||"")}</b>${SY.token?`<button class="btn sm" id="syNow">立即同步</button>`:""}</div>
    ${SY.token?`<p class="hint" style="margin:8px 0 0">已設定同步。筆記、書籤、螢光筆、讀經進度會自動同步到你 GitHub 裡的私人資料（只有你看得到）。沒有網路時會先存在這台裝置，連上網路再自動補傳。</p><p style="margin:10px 0 0"><button class="btn ghost sm" id="syClear">取消這台裝置的同步</button></p>`
    :`<p class="hint" style="margin:8px 0">還沒設定。每台裝置貼一次「同步密碼」就好：</p>
      <ol class="hint" style="margin:0 0 10px;padding-left:22px"><li>打開 <a href="https://github.com/settings/tokens/new?scopes=gist&description=my-bible-sync" target="_blank" rel="noopener">建立同步密碼</a>（要先登入 GitHub）</li><li>Expiration 選 <b>No expiration</b>，其他不用改，按最下面綠色的 <b>Generate token</b></li><li>複製出現的那串 <b>ghp_</b> 開頭的密碼，貼到下面</li></ol>
      <div class="row"><input id="syTok" type="password" placeholder="貼上 ghp_ 開頭的同步密碼" autocomplete="off"><button class="btn" id="sySave">儲存</button></div>`}</div></div>
  <div class="sec"><h4>離線使用</h4><p class="hint">和合本、KJV 讀過一次就會存在這台裝置。原文、字典、串珠平常是讀到才下載；出門前可以一次全部下載（約 40 MB），沒有網路也能用。</p>
    <button class="btn ghost sm" id="dlAll">${ICON.go}全部下載供離線使用</button> <span class="hint" id="dlProg">${LS.get("mybible.allDownloaded")?"已全部下載過 ✓":""}</span></div>
  <div class="sec"><h4>從 Claude 舊版搬資料</h4><p class="hint">在舊版（Claude 裡的我的聖經）→ 設定 →「搬到離線版」複製資料，再貼到這裡。只要做一次。</p>
    <textarea id="oldData" style="min-height:70px" placeholder="貼上舊版複製的資料"></textarea><p style="margin:8px 0 0"><button class="btn ghost sm" id="oldImp">匯入</button></p></div>
  <div class="sec"><h4>備份</h4><button class="btn ghost sm" id="expNotes">${ICON.copy}複製全部筆記</button></div>
  <div class="sec"><h4>資料來源</h4><p class="hint">和合本（1919，公版）、King James Version（公版）：midvash/bible-data<br>希臘文、希伯來文原文與字典：STEPBible.org，Tyndale House，CC BY 4.0<br>串珠：Treasury of Scripture Knowledge（MetaV 整理）</p><p class="hint">版本：離線版 2026.11.13</p></div>`);
  const D=$("#dbody");
  const fs=$("#fs"),lh=$("#lh");
  fs.oninput=()=>{s.fontSize=+fs.value;$("#fsv").textContent=fs.value;applyTheme();};fs.onchange=saveSettings;
  lh.oninput=()=>{s.lineHeight=+lh.value;$("#lhv").textContent=lh.value;applyTheme();};lh.onchange=saveSettings;
  D.querySelectorAll("[data-font]").forEach(b=>b.onclick=()=>{s.font=b.dataset.font;applyTheme();saveSettings();renderSettings();});
  D.querySelectorAll("[data-lay]").forEach(b=>b.onclick=()=>{s.layout=b.dataset.lay;saveSettings();renderAll();renderSettings();});
  D.querySelectorAll("[data-nm]").forEach(b=>b.onclick=()=>{s.names=b.dataset.nm;saveSettings();renderAll();renderSettings();});
  D.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{s.theme=b.dataset.theme;applyTheme();saveSettings();renderSettings();});
  D.querySelectorAll("[data-import]").forEach(b=>b.onclick=startImport);
  D.querySelectorAll("[data-mvup]").forEach(b=>b.onclick=()=>{const arr=allBibles();const i=arr.findIndex(x=>x.id===b.dataset.mvup);if(i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];s.order=arr.map(x=>x.id);s.shown=arr.map(x=>x.id).filter(x=>s.shown.includes(x));saveSettings();renderAll();renderSettings();}});
  D.querySelectorAll("[data-delbib]").forEach(b=>b.onclick=async()=>{const e=s.bibles.find(x=>x.id===b.dataset.delbib);if(!e)return;if(!await ask(`確定刪除譯本「${e.name}」？（筆記、書籤不會被刪除）`,"刪除",true))return;
    s.bibles=s.bibles.filter(x=>x.id!==e.id);s.shown=s.shown.filter(x=>x!==e.id);if(!s.shown.length)s.shown=[allBibles()[0].id];saveSettings();delete S.bibles[e.id];IDB.del(e.id);
    if(e.assetId&&S.assets){try{await S.assets.delete(e.assetId);}catch(err){}}renderAll();renderSettings();});
  if($("#sySave"))$("#sySave").onclick=async()=>{const ok=await setToken($("#syTok").value);if(ok)renderSettings();};
  if($("#syNow"))$("#syNow").onclick=async()=>{await syncNow();renderSettings();};
  if($("#syClear"))$("#syClear").onclick=async()=>{if(!await ask("取消這台裝置的同步？（資料還會留在這台裝置）","取消同步",true))return;clearToken();renderSettings();};
  $("#dlAll").onclick=()=>downloadAll($("#dlAll"),$("#dlProg"));
  $("#oldImp").onclick=()=>importOld($("#oldData").value);
  $("#expNotes").onclick=()=>{const arr=[...S.notes.values()].sort((a,b)=>(a.created||0)-(b.created||0));if(!arr.length){toast("還沒有筆記");return;}copyText(arr.map(n=>`【${fmtDate(n.created||n.updated)}】\n`+noteAsText(n)).join("\n\n==========\n\n"));};
}

/* ================= 匯入流程 ================= */
function startImport(){$("#fileIn").value="";$("#fileIn").click();}
$("#fileIn").onchange=async()=>{
  const f=$("#fileIn").files[0]; if(!f)return;
  modal(`<h3>讀取檔案中…</h3><p class="muted">${esc(f.name)}</p>`);
  let text; try{text=await f.text();}catch(e){modal(`<h3>讀不到這個檔案</h3><div class="acts"><button class="btn" onclick="closeModal()">好</button></div>`);return;}
  await new Promise(r=>setTimeout(r,30));
  const res=normalizeBible(text);
  if(res.count<500){modal(`<h3>看不懂這個檔案</h3><p class="hint">只讀到 ${res.count} 節經文。請確認下載的是聖經 JSON 檔（例如 cuv.json、kjv.json），而不是網頁。</p><div class="acts"><button class="btn" onclick="closeModal()">好</button></div>`);return;}
  const base=f.name.replace(/\.[^.]+$/,"");
  const guessName=res.meta.name||(/cuv/i.test(base)?"和合本":/kjv/i.test(base)?"King James Version":base);
  const guessShort=(/cuv/i.test(base)?"和合本":"")||res.meta.short||(/kjv/i.test(base)?"KJV":base).toString().slice(0,10);
  const sample=(res.data.books[42][2]||[])[15]||"";
  modal(`<h3>匯入譯本</h3><p class="hint">讀到 ${res.nBooks} 卷書、${res.count.toLocaleString()} 節經文。</p>
   ${sample?`<div class="prev" style="cursor:default"><div class="ref">約翰福音 3:16</div><div class="tx">${esc(sample)}</div></div>`:""}
   <label class="f">譯本名稱</label><input id="imName" value="${esc(guessName)}">
   <label class="f">簡稱（顯示在上方按鈕）</label><input id="imShort" value="${esc(guessShort)}">
   <label class="f">語言</label><select id="imLang"><option value="zh">中文</option><option value="en">英文</option><option value="other">其他</option></select>
   ${S.assets?"":`<p class="hint" style="color:var(--danger)">目前無法上傳到雲端，這個譯本只會存在這台裝置。</p>`}
   <div class="acts"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" id="imOk">匯入</button></div>`);
  $("#imLang").value=res.data.lang==="en"?"en":res.data.lang==="zh"?"zh":(/^zh/i.test(res.data.lang)?"zh":/^en/i.test(res.data.lang)?"en":"other");
  $("#imOk").onclick=async()=>{
    const name=$("#imName").value.trim()||guessName, short=$("#imShort").value.trim()||name.slice(0,6), lang=$("#imLang").value;
    res.data.lang=lang; res.data.name=name;
    const json=JSON.stringify(res.data); const id="bib"+Date.now().toString(36);
    $("#imOk").disabled=true; $("#imOk").textContent="上傳中…";
    let assetId=null;
    if(S.assets){try{const up=await S.assets.upload(new Blob([json],{type:"application/json"}),{type:"application/json"});assetId=up.id;}catch(e){toast("上傳雲端失敗，先存在這台裝置");}}
    await IDB.put(id,json); S.bibles[id]=res.data;
    const entry={id,name,short,lang,count:res.count,assetId};
    const s=S.settings; s.bibles=[...s.bibles,entry];
    // 中文放前面
    if(s.shown.length<3) s.shown=allBibles().map(x=>x.id).filter(x=>s.shown.includes(x)||x===id);
    saveSettings(); closeModal(); renderAll(); if(Panels.cur==="settings")renderSettings();
    toast(`已匯入「${name}」`);
  };
};

/* ================= 開始 ================= */
initStore();
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="activated"&&navigator.serviceWorker.controller)toast("已更新到新版本，下次打開會套用",3500);});});
    setInterval(()=>reg.update().catch(()=>{}),3600000);
  }).catch(()=>{});
}
</script>
